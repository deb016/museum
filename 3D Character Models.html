<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Character Models</title>
<style>
:root{--bg:#f1ece2;--fg:#2b2620;--card:#fff;--bd:#d8d0c0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b18;--fg:#eee8dc;--card:#2a2723;--bd:#47423a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b18;--fg:#eee8dc;--card:#2a2723;--bd:#47423a;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#wrap{display:flex;flex-direction:column;height:100%}
h1{font-size:16px;margin:10px 14px 0;font-weight:600}
#c{flex:1;min-height:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
small{text-align:center;opacity:.65;padding:0 12px 8px}
</style></head><body>
<div id="wrap"><h1>3D character models · drag to rotate</h1><div id="c"></div>
<div id="bar"><button id="bF">Front</button><button id="bB">Back</button><button id="bS">Side</button><button id="bW" class="on">Walk</button><button id="bA">Auto-spin</button></div>
<small>Stylized low-poly models built from the outfits in your photos.</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const el=document.getElementById('c');
const scene=new THREE.Scene();
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
scene.background=new THREE.Color(dark?0x1d1b18:0xf1ece2);
const cam=new THREE.PerspectiveCamera(35,1,.1,50);cam.position.set(0,1.1,6.2);cam.lookAt(0,.95,0);
const ren=new THREE.WebGLRenderer({antialias:true});el.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,.85));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,5,4);scene.add(dl);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.6,48),new THREE.MeshStandardMaterial({color:dark?0x34302a:0xe0d8c8}));
floor.rotation.x=-Math.PI/2;scene.add(floor);

const M=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const mesh=(g,m,p=[0,0,0],par)=>{const o=new THREE.Mesh(g,m);o.position.set(...p);if(par)par.add(o);return o};
function plaid(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
x.fillStyle='#c4d3e6';x.fillRect(0,0,128,128);x.fillStyle='rgba(120,150,195,.55)';
for(let i=0;i<128;i+=32){x.fillRect(i,0,14,128);x.fillRect(0,i,128,14)}
x.fillStyle='rgba(250,245,225,.7)';for(let i=16;i<128;i+=32){x.fillRect(i+6,0,6,128);x.fillRect(0,i+6,128,6)}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return new THREE.MeshStandardMaterial({map:t,roughness:.9})}
function pivot(par,x,y){const g=new THREE.Group();g.position.set(x,y,0);par.add(g);return g}
function face(h,r,skin){mesh(new THREE.SphereGeometry(.018,8,8),M(0x1a1210),[-.05,.02,r*.93],h);mesh(new THREE.SphereGeometry(.018,8,8),M(0x1a1210),[.05,.02,r*.93],h);
mesh(new THREE.BoxGeometry(.05,.012,.01),M(0xb06a5a),[0,-.06,r*.95],h)}

function boy(){
 const g=new THREE.Group(),skin=M(0xc99a72),tee=M(0xf5f5f5),pl=plaid(),jean=M(0x4b4d55,.95),shoe=M(0x4a2218,.25);
 mesh(new THREE.BoxGeometry(.4,.58,.26),tee,[0,1.3,0],g);
 mesh(new THREE.BoxGeometry(.5,.5,.09),pl,[0,1.28,-.15],g); // shirt back
 [-1,1].forEach(s=>{mesh(new THREE.BoxGeometry(.15,.5,.1),pl,[s*.22,1.28,.12],g);mesh(new THREE.BoxGeometry(.5,.07,.3),pl,[0,1.03,0],g).visible=false});
 const head=pivot(g,0,1.72);mesh(new THREE.SphereGeometry(.15,20,16),skin,[0,0,0],head);face(head,.15,skin);
 const hair=M(0x15100d,1);
 mesh(new THREE.SphereGeometry(.157,28,18,0,6.28,0,1.3),hair,[0,.01,-.008],head); // solid crown, no scalp showing
 mesh(new THREE.SphereGeometry(.154,28,18,Math.PI*.8,Math.PI*1.4,0,2.3),hair,[0,.005,-.005],head); // back + sides
for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,e=Math.random()*1.1;
  mesh(new THREE.SphereGeometry(.06,8,8),hair,[Math.cos(a)*Math.cos(e)*.15,.06+Math.sin(e)*.13,Math.sin(a)*Math.cos(e)*.15-.01],head)}
 mesh(new THREE.BoxGeometry(.2,.04,.05),M(0x111111,.2),[0,.2,.03],head); // sunglasses
 mesh(new THREE.CylinderGeometry(.05,.05,.1,12),skin,[0,-.16,0],g.children[0]&&head);
 [-1,1].forEach(s=>{
  const arm=pivot(g,s*.3,1.54);arm.name=s<0?'aL':'aR';
  mesh(new THREE.CylinderGeometry(.075,.085,.24,12),pl,[0,-.12,0],arm);
  mesh(new THREE.CylinderGeometry(.055,.065,.36,12),skin,[0,-.42,0],arm);
  if(s>0)mesh(new THREE.CylinderGeometry(.07,.07,.04,12),M(0x222222),[0,-.55,0],arm);
  const leg=pivot(g,s*.1,1.0);leg.name=s<0?'lL':'lR';
  mesh(new THREE.CylinderGeometry(.14,.18,.92,14),jean,[0,-.46,0],leg);
  mesh(new THREE.BoxGeometry(.15,.08,.3),shoe,[0,-.96,.06],leg);
 });
 return g}

function girl(){
 const g=new THREE.Group(),skin=M(0xd9a883),dress=M(0xf4efde,.3),pr=M(0xb5b894,.5),hair=M(0x15100d,.6);
 mesh(new THREE.CylinderGeometry(.17,.15,.38,20),dress,[0,1.38,0],g); // bodice
 mesh(new THREE.TorusGeometry(.17,.035,8,20),dress,[0,1.58,0],g).rotation.x=Math.PI/2; // ruched neckline
 mesh(new THREE.CylinderGeometry(.15,.28,.28,24,1,true),dress,[0,1.07,0],g).material.side=2;
 mesh(new THREE.CylinderGeometry(.27,.4,.3,24,1,true),dress,[0,.8,0],g).material.side=2;
 mesh(new THREE.CylinderGeometry(.38,.5,.3,24,1,true),M(0xe9eadb,.3),[0,.52,0],g).material.side=2;
 for(let i=0;i<40;i++){const a=Math.random()*6.28,y=.45+Math.random()*1.1,r=y<.7?.46:y<.95?.36:y<1.2?.24:.17;
  mesh(new THREE.SphereGeometry(.022,6,6),pr,[Math.cos(a)*r,y,Math.sin(a)*r],g)}
 mesh(new THREE.CylinderGeometry(.045,.05,.1,12),skin,[0,1.66,0],g);
 const head=pivot(g,0,1.8);mesh(new THREE.SphereGeometry(.14,20,16),skin,[0,0,0],head);face(head,.14,skin);
 const hd=M(0x15100d,.6);hd.side=2;
 mesh(new THREE.SphereGeometry(.156,28,18,0,6.28,0,1.2),hair,[0,.005,-.01],head); // crown, fully covers scalp
 mesh(new THREE.SphereGeometry(.153,28,18,Math.PI*.9,Math.PI*1.2,0,2.5),hd,[0,0,-.005],head); // back + sides dome, no skin showing
 mesh(new THREE.BoxGeometry(.006,.05,.012),M(0x2a211c),[0,.15,.06],head).rotation.x=.9; // subtle center part line
 mesh(new THREE.CylinderGeometry(.15,.2,.7,28,1,true,Math.PI*.3,Math.PI*1.4),hd,[0,-.28,-.05],head); // long back + sides
 [-1,1].forEach(s=>{
  const st=mesh(new THREE.CylinderGeometry(.045,.03,.56,12),hair,[s*.145,-.27,.075],head);st.scale.z=.55;st.rotation.z=s*.05; // face-framing front strands
  mesh(new THREE.SphereGeometry(.032,10,10),hair,[s*.158,-.56,.082],head).scale.set(1,1,.6);
  mesh(new THREE.SphereGeometry(.05,12,10),hair,[s*.125,.06,.07],head).scale.set(1,1.1,.7); // side-swept hairline
 });
 [-1,1].forEach(s=>{
  const arm=pivot(g,s*.24,1.55);arm.name=s<0?'aL':'aR';
  mesh(new THREE.CylinderGeometry(.045,.05,.6,12),skin,[0,-.3,0],arm);
  if(s<0)mesh(new THREE.CylinderGeometry(.052,.052,.025,12),M(0xcccccc,.2),[0,-.52,0],arm);
  const leg=pivot(g,s*.08,.4);leg.name=s<0?'lL':'lR';
  mesh(new THREE.CylinderGeometry(.045,.055,.4,12),skin,[0,-.2,0],leg);
  const sh=mesh(new THREE.BoxGeometry(.08,.05,.22),M(0xe8dcc4,.4),[0,-.42,.07],leg);
 });
 return g}

const A=boy(),B=girl();A.position.x=-.9;B.position.x=.9;
const root=new THREE.Group();root.add(A,B);scene.add(root);
const bobble=[A,B];
let walk=true,spin=false,t=0,target=0,rot=0,drag=null;
function size(){const w=el.clientWidth,h=el.clientHeight;ren.setSize(w,h);cam.aspect=w/h;cam.position.z=w/h<1?9:6.2;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
el.addEventListener('pointerdown',e=>{drag=e.clientX;spin=false;bA.classList.remove('on')});
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(drag!==null){target+=(e.clientX-drag)*.01;drag=e.clientX}});
function set(a){target=a;spin=false;bA.classList.remove('on')}
bF.onclick=()=>set(Math.round(target/6.2832)*6.2832);
bB.onclick=()=>set(Math.round(target/6.2832)*6.2832+Math.PI);
bS.onclick=()=>set(Math.round(target/6.2832)*6.2832+Math.PI/2);
bW.onclick=()=>{walk=!walk;bW.classList.toggle('on',walk)};
bA.onclick=()=>{spin=!spin;bA.classList.toggle('on',spin)};
function loop(){requestAnimationFrame(loop);t+=.05;if(spin)target+=.015;rot+=(target-rot)*.12;root.rotation.y=rot;
 [A,B].forEach((c,i)=>{const sw=walk?Math.sin(t+i*.6)*.5:0;
  c.children.forEach(o=>{if(o.name==='lL')o.rotation.x=sw;if(o.name==='lR')o.rotation.x=-sw;
   if(o.name==='aL')o.rotation.x=-sw*.8;if(o.name==='aR')o.rotation.x=sw*.8});
  c.position.y=walk?Math.abs(Math.sin(t+i*.6))*.03:0});
 ren.render(scene,cam)}
loop();
</script></body></html>
